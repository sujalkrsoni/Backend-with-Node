version : "3.8"

services:
  mongo:
    image : mongo:latest
    ports : 
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sujal
      MONGO_INITDB_ROOT_PASSWORD: mrcoder123
    volumes:
      - /home/sujalsoni/Backend-with-Node/18. Docker/Intro:/data/db

  mongo-express:
    image : mongo-express:latest
    ports :
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: sujal
      ME_CONFIG_MONGODB_ADMINPASSWORD: mrcoder123
      ME_CONFIG_MONGODB_SERVER: mongo


